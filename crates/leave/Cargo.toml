[package]
name = "leave"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

# 口 (routes)・検証 (settings / pages)・一番星の応答の解釈 (ichiban)・SQL を流す実装 (pg) を持ち、
# native でも wasm32-unknown-unknown でもビルドできる (接続も R2 の実装も持たない。張るのは直下の worker と tests/)。
[dependencies]
# 出どころは直下の Cargo.toml の [workspace.dependencies] の 1 か所 (ここに git / path を書かない)
alc-core-wasm = { workspace = true }
alc-worker-db = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# PDF のページ数を数える (nom の parser だけ。chrono・rayon・画像は切る。wasm32-unknown-unknown でビルドできる)
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# スキャンの PDF とチケットの照合・Queue の再配送でも同じになる R2 の key (Cargo.lock に既に在る版)
sha2 = { version = "0.11", default-features = false }
# 型付きの文の型 (`Type`) と `Row`。接続は張らない (wasm 用の feature `js` は直下の worker と alc-worker-db が付ける)
tokio-postgres = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-uuid-1"] }
unicode-normalization = { version = "0.1", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
# tests/ の実 DB の接続 (runtime 付き)。dev-dependency なので wasm のビルドには入らない
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
tower = { version = "0.5", features = ["util"] }
