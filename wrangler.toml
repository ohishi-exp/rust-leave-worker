# 休暇申請書 (PDF) の管理 API の Worker (Refs #1)。型は ippoan/alc-vein-worker・ippoan/alc-dtako-worker と同じ。
#
# ★ この Worker は JWT を検証せず、auth-worker が付け直した X-Tenant-ID / X-User-Role を信頼する。
#   本番 (トップレベル) の到達経路は auth-worker からの Service Binding だけにする:
#   - workers_dev = false / preview_urls = false (*.workers.dev と preview URL を開けない)
#   - route / routes / custom_domain を書かない
#   staging (env.staging) だけはテストから叩くため workers_dev = true にし、その workers.dev の
#   ホスト名は Cloudflare Access で保護する。workers_dev = true を許すのは env.staging だけ。
#   scripts/check-exposure.sh が CI で毎回これを検査する。
# ★ 表の順を変えない・前の方に表を足さない (scripts/check-exposure-test.sh の陰性対照は、特定の表の
#   直前に行を挿して崩す作り。CLAUDE.md)。新しい表は placement の表より後に置く。
name = "rust-leave-worker"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

# 応答ヘッダー x-worker-version / x-worker-tag の元 (src/lib.rs)。binding は env に継承されないので
# トップレベルと env.staging の両方に要る。tag / message は deploy の --tag / --message (deploy.yml)
[version_metadata]
binding = "CF_VERSION_METADATA"

# 本番の DB は aws:ap-northeast-1。Worker をその近くで動かす
[placement]
region = "aws:ap-northeast-1"

# 本番でもログを残す (env に継承されないので、staging は下で別に書く)。口が出すログは段の名前と kind だけ
[observability]
enabled = true

# 本番の DB: Cloudflare Hyperdrive の binding LEAVE_HYPERDRIVE (src/db.rs)。設定は実行用ロールのもの 1 つを
# 複数の worker で共有する (worker ごとに作らない。id は ippoan/alc-vein-worker・ippoan/alc-dtako-worker と同じ)。
# 接続先・資格情報・TLS は設定の側に在り、ここに書くのは設定の ID だけ。
# env.staging / env.local には置かない (binding は env に継承されない。scripts/check-exposure.sh が検査する)。
[[hyperdrive]]
binding = "LEAVE_HYPERDRIVE"
id = "6bdf446634034f989d4e094d5510b162"

# 本番の R2 (休暇申請書の PDF の置き場。書くのはメール受信の口、この Worker の管理 API は読むだけ)。
# binding は env に継承されないので、staging は下で別の bucket を指す
[[r2_buckets]]
binding = "LEAVE_R2"
bucket_name = "leave-pdfs"

# 一番星 Worker (Service Binding 専用・認可なし)。部門一覧と社員の口の上流。本番だけに置く
# (一番星 Worker に staging は無い。staging から本番の社員マスタを引かせないため、env.staging には置かない)
[[services]]
binding = "ICHIBAN_DB"
service = "ichibanboshi-ichiban"

# メール取り込みの口 (/internal/ingest) の共有 secret。ippoan/email-receiver の wrangler.toml と同じ Secrets Store の
# secret (値は repo に無い。worker では `.get()` で実値にする)。binding は env に継承されないので staging にも書く
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# staging: DB は ippoan/alc-vein-worker の staging と同じもの (Workers VPC の binding LEAVE_DB_VPC から
# 既存の Tunnel 経由で PgBouncer へ繋ぐ。src/db.rs)。Hyperdrive は通さない。ICHIBAN_DB は無い (部門・社員の口は 503)。
[env.staging]
name = "rust-leave-worker-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# Worker の実行場所を staging の DB の近くに寄せる (ippoan/alc-vein-worker の staging と同じ region)
[env.staging.placement]
region = "aws:ap-northeast-3"

# staging の DB への口 (vein の staging と同じ VPC Service を共有)。本番 (トップレベル) には置かない
# (scripts/check-exposure.sh が検査)
[[env.staging.vpc_services]]
binding = "LEAVE_DB_VPC"
# service_id は VPC Service の参照 (宛先の Tunnel・host:port は Service 側に閉じる)
service_id = "01a0efa3-57ee-7631-912e-7f261d828127"
remote = true

# staging の R2 は staging 用の bucket (本番の bucket を指すと本番の object を読み書きする。
# scripts/check-exposure.sh が検査)
[[env.staging.r2_buckets]]
binding = "LEAVE_R2"
bucket_name = "leave-pdfs-staging"

[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# ローカル (`wrangler dev --env local`) 専用。deploy しない。
# binding を持たない (binding は env に継承されない) ので、src/db.rs は文字列 DATABASE_URL の段で繋ぐ
[env.local]
name = "rust-leave-worker-local"
workers_dev = false
preview_urls = false
